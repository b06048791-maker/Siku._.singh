  'text-counter': {
    icon: '📊',
    name: 'Text Counter',
    category: 'Text Tools',
    title: 'Free Online Character Counter & Word Counter Tool',
    description: 'Free online text counter - count characters, words, lines, sentences, and paragraphs instantly. Perfect for tweets, essays, SEO content, and social media posts.',
    keywords: 'text counter, character counter, word counter, count characters online, word count tool, free character count',
    h1: 'Free Online Text Counter',
    subtitle: 'Count characters, words, lines, and sentences in real time',
    longDesc: `Our free online text counter is the perfect tool for writers, students, social media managers, and SEO professionals. Whether you are crafting a tweet with a character limit, writing an essay, or optimizing content for search engines, you need to know exactly how many characters and words your text contains.\n\nThis text counter instantly counts characters (with and without spaces), words, lines, sentences, and paragraphs. It also estimates reading time based on a standard reading speed of 200 words per minute. No registration, no limits, completely free and works on mobile and desktop.`,

    faq: [

      <textarea id="tc-in" class="ui-input" rows="6" placeholder="Paste your text here..."></textarea>
      <div class="stats-grid" id="tc-stats"></div>
    `,
    init: () => {
      const inp = document.getElementById('tc-in');
      const out = document.getElementById('tc-stats');
      const update = () => {
        const t = inp.value;
        const words = t.trim() ? t.trim().split(/\s+/).length : 0;
        const stats = [
          {n: t.length, l: 'Chars'},
          {n: t.replace(/\s/g,'').length, l: 'No Space'},
          {n: words, l: 'Words'},
          {n: t ? t.split('\n').length : 0, l: 'Lines'},
          {n: t.split(/[.!?]+/).filter(x=>x.trim()).length, l: 'Sentences'},
          {n: Math.ceil(words/200) + 'm', l: 'Read'}
        ];
        out.innerHTML = stats.map(s => `<div class="stat"><div class="stat-num">${s.n}</div><div class="stat-lbl">${s.l}</div></div>`).join('');
      };
      inp.addEventListener('input', update);
      update();
    }
  },

  'case-converter': {
    icon: '🔤',
    name: 'Case Converter',
    category: 'Text Tools',
    title: 'Free Case Converter - UPPER, lower, Title Case Tool',
    description: 'Free online case converter. Instantly convert text to UPPERCASE, lowercase, Title Case, or Sentence case. Perfect for social media, documents, and code.',

      <div class="btn-row">
        <button class="btn" onclick="ccConvert('upper')">UPPERCASE</button>
        <button class="btn" onclick="ccConvert('lower')">lowercase</button>
        <button class="btn pink" onclick="ccConvert('title')">Title Case</button>

      </div>
      <textarea id="cc-out" class="ui-input" rows="5" readonly placeholder="Result appears here..."></textarea>
      <button class="btn green" onclick="ccCopy()">📋 Copy Result</button>
    `,
    init: () => {},
    helpers: {
      ccConvert: (type) => {
        const i = document.getElementById('cc-in'), o = document.getElementById('cc-out');
        let t = i.value;
        if (type === 'upper') t = t.toUpperCase();
        else if (type === 'lower') t = t.toLowerCase();
        else if (type === 'title') t = t.replace(/\w\S*/g, w => w.charAt(0).toUpperCase() + w.substr(1).toLowerCase());
        else if (type === 'sentence') t = t.charAt(0).toUpperCase() + t.slice(1).toLowerCase();
        o.value = t;
      },
      ccCopy: () => {
        const o = document.getElementById('cc-out');
        if (!o.value) return showToast('Nothing to copy');
        navigator.clipboard.writeText(o.value).then(() => showToast('📋 Copied!'));
      }
    }
  },

    name: 'Lorem Ipsum Generator',

      {q: 'Why use Lorem Ipsum?', a: 'It has a natural-looking distribution of letters that mimics real text, so you can judge layout without real content.'},

    render: () => `
      <input type="number" id="lg-count" class="ui-input" value="3" min="1" max="50" placeholder="Amount">
      <select id="lg-type" class="ui-input">

      <textarea id="lg-out" class="ui-input" rows="8" readonly placeholder="Generated text..." style="margin-top:10px;"></textarea>
      <button class="btn green" onclick="lgCopy()">📋 Copy</button>
    `,
    init: () => {},
    helpers: {
      lgGenerate: () => {
        const words = 'lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua'.split(' ');
        const count = parseInt(document.getElementById('lg-count').value) || 3;
        const type = document.getElementById('lg-type').value;
        let result = '';
        if (type === 'w') {
          const arr = [];
          for (let i = 0; i < count * 50; i++) arr.push(words[Math.floor(Math.random() * words.length)]);
          result = arr.join(' ');
        } else {
          const arr = [];
          for (let i = 0; i < count; i++) {
            const s = [];
            for (let j = 0; j < 4; j++) {
              const w = [];
              for (let k = 0; k < 8; k++) w.push(words[Math.floor(Math.random() * words.length)]);
              s.push(w.join(' ').replace(/^./, c => c.toUpperCase()) + '.');
            }
            arr.push(s.join(' '));
          }
          result = arr.join('\n\n');
        }
        document.getElementById('lg-out').value = result;
      },

        const o = document.getElementById('lg-out');
        if (!o.value) return showToast('Generate first');
        navigator.clipboard.writeText(o.value).then(() => showToast('📋 Copied!'));

    }
  },

    longDesc: `Base64 is a binary-to-text encoding scheme commonly used to represent binary data in text format. It's used everywhere: in email attachments, JSON web tokens, data URLs for images, and API authentication.\n\nOur free Base64 encoder/decoder lets you quickly convert any text to Base64 or decode Base64 back to text. It handles Unicode (Hindi, emoji, etc.) correctly, unlike simple encoders.`,

        <button class="btn" onclick="b64Encode()">🔒 Encode</button>

    init: () => {},
    helpers: {

        const i = document.getElementById('b64-in'), o = document.getElementById('b64-out');

        const o = document.getElementById('b64-out');
        if (!o.value) return showToast('Nothing');

    }

  'hash-generator': {
    icon: '🔐',
    name: 'Hash Generator',
    category: 'Security',
    title: 'Free SHA-256, SHA-1, SHA-512 Hash Generator Online',
    description: 'Free online hash generator. Generate SHA-1, SHA-256, and SHA-512 hashes for any text. Perfect for password hashing, file verification, and data integrity.',

    subtitle: 'Generate SHA-1, SHA-256, and SHA-512 hashes',
    longDesc: `Cryptographic hashing converts any text into a fixed-length "fingerprint" that cannot be reversed. It's used for password storage, file integrity verification, digital signatures, and blockchain technology.\n\nOur free hash generator supports SHA-1, SHA-256, and SHA-512 — the most common cryptographic hash algorithms. All hashing happens in your browser using the Web Crypto API, so your data never leaves your device.`,

    ],
    render: () => `
      <textarea id="hg-in" class="ui-input" rows="3" placeholder="Enter text to hash..."></textarea>
      <button class="btn" onclick="hgGenerate()">⚡ Generate Hashes</button>
      <div id="hg-out" style="margin-top:12px;"></div>
    `,
    init: () => {},
    helpers: {
      hgGenerate: async () => {
        const inp = document.getElementById('hg-in');
        const out = document.getElementById('hg-out');
        if (!inp.value) return showToast('Enter text');
        out.innerHTML = '<div style="text-align:center;padding:10px;">Generating...</div>';
        let html = '';
        for (const [name, algo] of [['SHA-1', 'SHA-1'], ['SHA-256', 'SHA-256'], ['SHA-512', 'SHA-512']]) {
          try {

        }

      }
    }

        Time: { 'Second (s)': 1, 'Minute (min)': 60, 'Hour (h)': 3600, 'Day': 86400, 'Week': 604800 },
        Data: { 'Byte (B)': 1, 'Kilobyte (KB)': 1024, 'Megabyte (MB)': 1048576, 'Gigabyte (GB)': 1073741824 }
      };
      window.__UNITS = UNIT;
      const cat = document.getElementById('uc-cat');
      const from = document.getElementById('uc-from');
      const to = document.getElementById('uc-to');
      const update = () => {
        const keys = Object.keys(UNIT[cat.value]);
        from.innerHTML = keys.map(k => `<option>${k}</option>`).join('');
        to.innerHTML = keys.map(k => `<option>${k}</option>`).join('');
        if (keys.length > 1) to.selectedIndex = 1;
      };
      cat.addEventListener('change', update);
      update();
    },
    helpers: {
      ucConvert: () => {
        const cat = document.getElementById('uc-cat').value;
        const from = document.getElementById('uc-from').value;
        const to = document.getElementById('uc-to').value;
        const val = parseFloat(document.getElementById('uc-val').value);

        const U = window.__UNITS[cat];
        let result;
        if (cat === 'Temperature') {
          let c;
          if (U[from] === 'C') c = val; else if (U[from] === 'F') c = (val - 32) * 5 / 9; else c = val - 273.15;

    helpers: {
      ddCalc: () => {
        const f = document.getElementById('dd-from').value;
        const t = document.getElementById('dd-to').value;
        const out = document.getElementById('dd-out');
        if (!f || !t) return out.innerHTML = '<div class="result-box error">Select both dates</div>';
        const d1 = new Date(f), d2 = new Date(t);
        const days = Math.round((d2 - d1) / 86400000);
        const absDays = Math.abs(days);
        const weeks = (absDays / 7).toFixed(1);
        const months = (absDays / 30.44).toFixed(1);
        const years = (absDays / 365.25).toFixed(2);
        let businessDays = 0;
        const start = new Date(Math.min(d1, d2));
        const end = new Date(Math.max(d1, d2));
        for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
          const day = d.getDay();
          if (day !== 0 && day !== 6) businessDays++;
        }

/* ============================================================
   ROUTER & RENDERER
   ============================================================ */
function getToolSlug() {
  const url = new URL(window.location.href);
  let slug = url.searchParams.get('t');
  if (!slug && url.hash) slug = url.hash.replace('#', '');
  if (!slug) {
    const path = url.pathname.replace(/\/+$/, '');
    const m = path.match(/\/tools\/([^/]+)\/?$/);
    if (m && m[1] && m[1] !== 'index.html') slug = m[1];
  }
  return (slug || '').toLowerCase();
}

function renderTool(slug) {
  const main = document.getElementById('main');
  const tool = TOOLS[slug];

  if (!tool) return renderToolIndex();

  document.title = tool.title;
  updateMeta('description', tool.description);
  updateMeta('keywords', tool.keywords);
  setCanonical(`${SITE_URL}/tools/?t=${slug}`);
  setOg('og:title', tool.title);
  setOg('og:description', tool.description);
  setOg('og:url', `${SITE_URL}/tools/?t=${slug}`);

  const ld = {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "SoftwareApplication",
        "name": tool.h1,
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "offers": {"@type": "Offer", "price": "0", "priceCurrency": "INR"},
        "description": tool.description,
        "url": `${SITE_URL}/tools/?t=${slug}`,
        "aggregateRating": {"@type": "AggregateRating", "ratingValue": "4.8", "ratingCount": "1000"}
      },
      {
        "@type": "FAQPage",
        "mainEntity": tool.faq.map(f => ({
          "@type": "Question",
          "name": f.q,
          "acceptedAnswer": {"@type": "Answer", "text": f.a}
        }))
      },
      {
        "@type": "BreadcrumbList",
        "itemListElement": [
          {"@type": "ListItem", "position": 1, "name": "Home", "item": SITE_URL + "/"},
          {"@type": "ListItem", "position": 2, "name": "Tools", "item": SITE_URL + "/tools/"},
          {"@type": "ListItem", "position": 3, "name": tool.name, "item": `${SITE_URL}/tools/?t=${slug}`}
        ]
      }
    ]
  };
  document.getElementById('ld-json').textContent = JSON.stringify(ld);

  const related = Object.entries(TOOLS)
    .filter(([s, t]) => s !== slug && t.category === tool.category && t.icon)
    .slice(0, 3);
  if (related.length < 3) {
    const extra = Object.entries(TOOLS).filter(([s, t]) => s !== slug && !related.find(r => r[0] === s) && t.icon).slice(0, 3 - related.length);
    related.push(...extra);
  }

  main.innerHTML = `
    <div class="breadcrumb">
      <a href="/">Home</a><span>/</span>
      <a href="/tools/">Tools</a><span>/</span>
      <span style="color:#fff;">${tool.name}</span>
    </div>
    <h1><span class="icon">${tool.icon}</span>${tool.h1}</h1>
    <p class="subtitle">${tool.subtitle}</p>

    <div class="card">
      <div id="tool-ui">${tool.render()}</div>
    </div>

    <div class="card">
      <div class="card-title">📖 About ${tool.name}</div>
      <div class="description">${tool.longDesc.split('\n\n').map(p => `<p>${p}</p>`).join('')}</div>
    </div>

    <div class="card">
      <div class="card-title">📝 How to Use</div>
      <ol class="howto-list">
        ${tool.howto.map(s => `<li>${s}</li>`).join('')}
      </ol>
    </div>

    <div class="card">
      <div class="card-title">❓ Frequently Asked Questions</div>
      ${tool.faq.map((f, i) => `
        <div class="faq-item" onclick="this.classList.toggle('open')">
          <div class="faq-q">${f.q}</div>
          <div class="faq-a">${f.a}</div>
        </div>
      `).join('')}
    </div>

    ${related.length ? `
    <div class="card">
      <div class="card-title">🔗 Related Tools</div>
      <div class="related-grid">
        ${related.map(([s, t]) => `<a class="related-tile" href="?t=${s}"><span class="related-icon">${t.icon}</span><span class="related-name">${t.name}</span></a>`).join('')}
      </div>
    </div>
    ` : ''}

    <div class="cta-box">
      <h3>🚀 Unlock 60+ More Tools in the Full App</h3>
      <p>AI Chat, Smart Image Generation, Code Generator, and more — completely free.</p>
      <a href="${APP_URL}" class="btn">Open Sikku Dashboard App</a>
    </div>
  `;

  setTimeout(() => {
    try { tool.init && tool.init(); } catch(e) { console.warn(e); }
    if (tool.helpers) {
      Object.entries(tool.helpers).forEach(([name, fn]) => { window[name] = fn; });
    }
  }, 50);

  window.scrollTo({top: 0, behavior: 'auto'});
}

function renderToolIndex() {
  document.title = 'All Free Tools - Sikku Tools';
  updateMeta('description', 'Browse all 60+ free online tools: calculators, converters, generators, and more. No registration required.');
  setCanonical(`${SITE_URL}/tools/`);
  document.getElementById('ld-json').textContent = JSON.stringify({
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "name": "All Free Tools - Sikku Tools",
    "url": `${SITE_URL}/tools/`
  });

  const categories = {};
  Object.entries(TOOLS).forEach(([slug, t]) => {
    if (!t.icon || t.category === 'Legal') return;
    if (!categories[t.category]) categories[t.category] = [];
    categories[t.category].push({slug, ...t});
  });

  const main = document.getElementById('main');
  main.innerHTML = `
    <h1>🛠️ All Free Online Tools</h1>
    <p class="subtitle">60+ free tools — calculators, converters, generators, and more. No registration required.</p>
    ${Object.entries(categories).map(([cat, tools]) => `
      <div class="card">
        <div class="card-title">${cat}</div>
        <div class="related-grid">
          ${tools.map(t => `<a class="related-tile" href="?t=${t.slug}"><span class="related-icon">${t.icon}</span><span class="related-name">${t.name}</span></a>`).join('')}
        </div>
      </div>
    `).join('')}
    <div class="cta-box">
      <h3>🚀 Want AI Features Too?</h3>
      <p>AI Chat, Smart Image Generation, Code Generator — completely free in the app.</p>
      <a href="${APP_URL}" class="btn">Open Sikku Dashboard App</a>
    </div>
  `;
}

function updateMeta(name, content) {
  let el = document.querySelector(`meta[name="${name}"]`);
  if (!el) { el = document.createElement('meta'); el.name = name; document.head.appendChild(el); }
  el.content = content;
}
function setOg(prop, content) {
  let el = document.querySelector(`meta[property="${prop}"]`);
  if (!el) { el = document.createElement('meta'); el.setAttribute('property', prop); document.head.appendChild(el); }
  el.content = content;
}
function setCanonical(url) {
  let el = document.querySelector('link[rel="canonical"]');
  if (!el) { el = document.createElement('link'); el.rel = 'canonical'; document.head.appendChild(el); }
  el.href = url;
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._tt);
  window._tt = setTimeout(() => t.classList.remove('show'), 2500);
}

/* ============================================================
   INIT
   ============================================================ */
(function init() {
  const slug = getToolSlug();
  if (slug) renderTool(slug);
  else renderToolIndex();

  window.addEventListener('hashchange', () => {
    const s = getToolSlug();
    if (s) renderTool(s); else renderToolIndex();
  });
})();
</script>
